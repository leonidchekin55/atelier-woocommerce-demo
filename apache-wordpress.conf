<Directory /var/www/html>
    AllowOverride All
    Options FollowSymLinks
    RewriteEngine On
    RewriteBase /
    RewriteRule ^index\.php$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]
</Directory>

# Keep browser-side defaults restrictive without blocking the inline scripts
# used by WordPress and WooCommerce.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

# Only theme assets are shared-cacheable. HTML, checkout, sessions and uploads
# keep their own headers; theme CSS/JS URLs change with ATELIER_VERSION.
<LocationMatch "^/wp-content/themes/atelier-shop/(assets/|style\.css$)">
    Header set Cache-Control "public, max-age=604800"
</LocationMatch>
