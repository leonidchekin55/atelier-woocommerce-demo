services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: localroot
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "0"
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/atelier-shop:/var/www/html/wp-content/themes/atelier-shop
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./import:/var/www/html/wp-content/atelier-import
      - ./apache-wordpress.conf:/etc/apache2/conf-enabled/atelier-wordpress.conf:ro
volumes:
  db_data:
  wp_data:
