name: Local verification

on:
  pull_request:
  push:
    branches: [main, improve/public-demo-readiness]

permissions:
  contents: read

jobs:
  image-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned application image
        run: docker build --pull -t atelier-ci:${{ github.sha }} .
      - name: Run disposable recovery integration checks
        env:
          ATELIER_TEST_IMAGE: atelier-ci:${{ github.sha }}
        run: python3 tests/recovery-integration.py
